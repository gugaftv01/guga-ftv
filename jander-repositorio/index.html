<title>Jander Venâncio · Corretor de Imóveis</title>

<meta name="description" content="Jander Venâncio — Corretor de Imóveis. Acompanhe meus imóveis e fale comigo.">

<style>
  :root{ --laranja:#ef8a3c; --creme:#f2ecdd; --ink:#0c0c0c; }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  body{min-height:100vh;background:#060606;color:#fff;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;justify-content:center;padding:26px 16px calc(34px + env(safe-area-inset-bottom))}
  .wrap{width:min(452px,100%);display:flex;flex-direction:column;align-items:center}
  /* ---- logo topo ---- */
  .topo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
  .topo .mark{width:62px;height:auto;filter:drop-shadow(0 6px 16px rgba(239,138,60,.35))}
  .topo .nome{font-family:'Poppins',sans-serif;font-weight:800;font-size:21px;letter-spacing:.5px;color:#fff;text-align:center;line-height:1}
  .topo .sub{font-family:'Poppins',sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.3em;color:var(--laranja);text-transform:uppercase;margin-top:7px}
  /* ---- banners ---- */
  .links{width:100%;display:flex;flex-direction:column;gap:16px}
  .banner{position:relative;display:block;border-radius:22px;overflow:hidden;min-height:196px;
    background:var(--card,#151515);text-decoration:none;color:#fff;
    box-shadow:0 14px 30px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);
    transition:transform .18s ease, box-shadow .18s ease}
  .banner:hover,.banner:focus-visible{transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,.6);outline:none}
  .banner .bg{position:absolute;top:0;right:0;bottom:0;height:100%;width:64%;z-index:1;object-fit:cover;object-position:52% 16%}
  .banner .glow{position:absolute;top:50%;right:4%;width:180px;height:180px;transform:translateY(-50%);
    border-radius:50%;background:radial-gradient(closest-side,var(--ac),transparent 72%);opacity:.6;filter:blur(10px);z-index:0}
  .banner .shade{position:absolute;inset:0;background:
      linear-gradient(90deg,var(--card) 0%,var(--card) 33%,rgba(10,10,10,.35) 60%,transparent 82%)}
  .body{position:relative;z-index:2;padding:22px 20px;max-width:70%;display:flex;flex-direction:column;height:100%;justify-content:center;min-height:196px}
  .hdr{display:flex;align-items:center;gap:11px;margin-bottom:5px}
  .pico{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;box-shadow:0 7px 16px rgba(0,0,0,.45)}
  .pico svg{width:26px;height:26px;display:block}
  .pico-ig{background:linear-gradient(45deg,#f09433,#e6683c 30%,#dc2743 55%,#cc2366 75%,#bc1888)}
  .pico-wa{background:#25D366}
  .pico-yt{background:#ff0000}
  .tag{font-family:'Poppins',sans-serif;font-weight:700;font-size:10px;letter-spacing:.24em;color:var(--ac);text-transform:uppercase}
  .banner h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:21px;line-height:1.2;margin:8px 0 15px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .banner h2 b{color:var(--ac)}
  .cta{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--ac);color:#131313;
    font-weight:700;font-size:13.5px;padding:11px 17px;border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .cta.escuro{color:#fff}
  .cta svg{width:15px;height:15px}
  /* cores por card */
  .ig{--card:#1a140d;--ac:#ef8a3c}
  .whats{--card:#0b2a1e;--ac:#2fd36b}
  .yt{--card:#1d1010;--ac:#ff4136}
  /* ---- rodapé ---- */
  footer{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .selo{width:60px;height:60px;border-radius:50%;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
  .selo img{width:100%;height:100%;object-fit:cover}
  .social{display:flex;gap:14px}
  .social a{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:background .16s}
  .social a:hover{background:rgba(239,138,60,.2)}
  .copy{color:rgba(255,255,255,.4);font-size:11px;margin-top:4px;text-align:center}
  /* ---- mensagem (toast) do YouTube ---- */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);
    max-width:min(400px,92vw);background:#15110c;color:#fff;border:1px solid var(--laranja);
    border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.45;text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,.6);z-index:50;opacity:0;pointer-events:none;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast b{color:var(--laranja)}
</style>
